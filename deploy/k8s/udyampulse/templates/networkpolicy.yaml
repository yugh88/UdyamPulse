{{- if .Values.networkPolicy.enabled }}
# Default deny for the release, then only the flows the architecture needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "up.name" . }}-default-deny
  labels: {{- include "up.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "up.name" . }}-web-ingress
  labels: {{- include "up.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "up.selector" (dict "root" . "component" "web") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 8080}]   # from the ingress controller
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "up.name" . }}-api-ingress
  labels: {{- include "up.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "up.selector" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:   # the web pods proxy /api
        - podSelector:
            matchLabels: {{- include "up.selector" (dict "root" . "component" "web") | nindent 14 }}
      ports: [{port: 8000}]
    - from:   # Prometheus scrapes /metrics
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports: [{port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "up.name" . }}-worker-ingress
  labels: {{- include "up.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "up.selector" (dict "root" . "component" "worker") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports: [{port: 9191}]
{{- end }}
