apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "up.name" . }}-worker
  labels: {{- include "up.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.keda.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: {{- include "up.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "up.podLabels" . | nindent 8 }}
        {{- include "up.selector" (dict "root" . "component" "worker") | nindent 8 }}
        azure.workload.identity/use: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9191"
    spec:
      serviceAccountName: {{ include "up.name" . }}
      securityContext: {{- include "up.podSecurity" . | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.image.app }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "worker"]
          ports:
            - {name: metrics, containerPort: 9191}
          env:
            {{- include "up.appEnv" . | nindent 12 }}
            - name: UP_WORKER_THREADS
              value: {{ .Values.worker.threads | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          securityContext: {{- include "up.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: var, mountPath: /app/var}
      # SIGTERM stops taking new jobs; a running job finishes or is redelivered after its lease (idempotent).
      terminationGracePeriodSeconds: 120
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 1Gi}}
        - {name: var, emptyDir: {sizeLimit: 2Gi}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "up.name" . }}-worker
  labels: {{- include "up.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.worker.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "up.selector" (dict "root" . "component" "worker") | nindent 6 }}
{{- if .Values.worker.keda.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "up.name" . }}-worker
  labels: {{- include "up.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "up.name" . }}-worker
  minReplicaCount: {{ .Values.worker.keda.minReplicas }}
  maxReplicaCount: {{ .Values.worker.keda.maxReplicas }}
  cooldownPeriod: 300
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ .Values.worker.keda.prometheusServer }}
        query: max(udyam_job_queue_depth{status="queued"})
        threshold: {{ .Values.worker.keda.queuedPerWorker | quote }}
{{- end }}
