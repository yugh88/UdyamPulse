{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "up.name" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "up.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: {{- include "up.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      # Pre-install hooks run before the chart's own ServiceAccount exists; migrations need only the DB URL.
      automountServiceAccountToken: false
      securityContext: {{- include "up.podSecurity" . | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.app }}:{{ .Values.image.tag }}"
          command: ["python", "-c", "from api.models.db import migrate; migrate()"]
          env: {{- include "up.appEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          securityContext: {{- include "up.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
{{- end }}
