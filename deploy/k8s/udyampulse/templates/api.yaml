apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "up.name" . }}-api
  labels: {{- include "up.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {{- include "up.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "up.podLabels" . | nindent 8 }}
        {{- include "up.selector" (dict "root" . "component" "api") | nindent 8 }}
        azure.workload.identity/use: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ include "up.name" . }}
      securityContext: {{- include "up.podSecurity" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "up.selector" (dict "root" . "component" "api") | nindent 14 }}
      containers:
        - name: api
          image: "{{ .Values.image.app }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No demo seed in a real deployment; migrations run in the pre-upgrade hook.
          command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers",
                    "--forwarded-allow-ips", "*", "--timeout-graceful-shutdown", "25"]
          ports:
            - {name: http, containerPort: 8000}
          env: {{- include "up.appEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          securityContext: {{- include "up.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}  # let the load balancer stop routing before shutdown
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: var, mountPath: /app/var}
      terminationGracePeriodSeconds: 30
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
        - {name: var, emptyDir: {sizeLimit: 512Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "up.name" . }}-api
  labels: {{- include "up.labels" . | nindent 4 }}
spec:
  selector: {{- include "up.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "up.name" . }}-api
  labels: {{- include "up.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "up.name" . }}-api
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.api.hpa.targetCPUUtilization }}}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{type: Percent, value: 50, periodSeconds: 60}]
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{type: Percent, value: 100, periodSeconds: 30}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "up.name" . }}-api
  labels: {{- include "up.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "up.selector" (dict "root" . "component" "api") | nindent 6 }}
