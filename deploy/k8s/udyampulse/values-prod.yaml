# AKS in Central India. Images come from the bank's Azure Container Registry.
image:
  app: udyampulseacr.azurecr.io/udyampulse-app
  web: udyampulseacr.azurecr.io/udyampulse-web
  tag: "1.0.0"
dataRegion: centralindia
serviceAccount:
  annotations:
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
config:
  UP_LLM_PROVIDER: azure_openai
  UP_OTEL_ENDPOINT: http://otel-collector.observability:4318
ingress:
  host: udyampulse.bank.example.in
