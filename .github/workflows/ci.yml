name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Build lake, train model, run EWS back-test
        run: |
          python -m data_gen.generate
          python -m data_gen.lake
          python -m ml.train
          python -m ml.ews
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests (PostgreSQL: migrations, partitions, row-level security)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE udyam_app LOGIN PASSWORD 'udyam_app' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -c "CREATE DATABASE udyampulse_test OWNER udyam_app"
          UP_TEST_DB_URL=postgresql+psycopg://udyam_app:udyam_app@localhost:5432/udyampulse_test python -m pytest -q
      - name: Dependency scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off || echo "::warning::pip-audit reported advisories"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint and format
        run: |
          npm run lint
          npm run format:check
      - name: Type-check
        run: npx tsc -b
      - name: Contrast check (WCAG 2.2 AA)
        run: npm run check:contrast
      - name: Unit tests
        run: npm test
      - run: npm run build
      - name: Dependency scan (npm audit)
        run: npm audit --audit-level=high || echo "::warning::npm audit reported advisories"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python deps into .venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Build lake and model
        run: |
          .venv/bin/python -m data_gen.generate
          .venv/bin/python -m data_gen.lake
          .venv/bin/python -m ml.train
          .venv/bin/python -m ml.ews
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Browser tests (both themes, axe accessibility)
        run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
