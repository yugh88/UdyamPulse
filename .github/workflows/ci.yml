name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Build lake, train model, run EWS back-test
        run: |
          python -m data_gen.generate
          python -m data_gen.lake
          python -m ml.train
          python -m ml.ews
      - name: Tests
        run: python -m pytest -q
      - name: Dependency scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off || echo "::warning::pip-audit reported advisories"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build
      - name: Dependency scan (npm audit)
        run: npm audit --audit-level=high || echo "::warning::npm audit reported advisories"
