# Service-level alerts. Thresholds match the SLOs in docs/CAPACITY.md (p95 < 300 ms reads, < 1 % 5xx).
groups:
  - name: udyampulse
    rules:
      - alert: ApiHighErrorRate
        expr: |
          sum(rate(udyam_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(udyam_http_requests_total[5m])), 1e-9) > 0.01
        for: 5m
        labels: {severity: page}
        annotations:
          summary: More than 1% of API requests are failing with 5xx
      - alert: ApiSlowReads
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(udyam_http_request_duration_seconds_bucket{method="GET"}[5m]))) > 0.3
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: p95 GET latency above 300 ms for 10 minutes
      - alert: JobQueueBacklog
        expr: sum(udyam_job_queue_depth{status="queued"}) > 500
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: More than 500 background jobs waiting; scale the workers
      - alert: JobsDeadLettered
        expr: increase(udyam_jobs_total{status="dead"}[15m]) > 0
        labels: {severity: ticket}
        annotations:
          summary: A background job exhausted its retries and is in the dead-letter queue
      - alert: OutboxStuck
        expr: max(udyam_outbox_pending) > 100
        for: 5m
        labels: {severity: page}
        annotations:
          summary: Outbox events are not being published; check the relay
      - alert: LlmBreakerOpen
        expr: max(udyam_llm_breaker_open) == 1
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: The LLM circuit breaker is open; memos fall back to deterministic templates
