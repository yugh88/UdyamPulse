# Local scrape config for `docker compose --profile observability up`.
# In Kubernetes the same targets are discovered from pod annotations (see deploy/k8s).
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: udyampulse-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: udyampulse-worker
    static_configs:
      - targets: ["worker:9191"]
